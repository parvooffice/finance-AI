services:
  - type: web
    name: taxometer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FASTAPI_HOSTPORT
        fromService:
          type: web
          name: taxometer-calculator
          property: hostport
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

  - type: web
    name: taxometer-calculator
    runtime: python
    plan: free
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: taxometer-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && node scripts/write-render-env.mjs && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: taxometer-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
